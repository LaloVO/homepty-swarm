name: Supply chain gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  dependency-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pinned uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.13"
          python-version: "3.12"

      - name: Audit exact isolated production lock
        shell: bash
        run: |
          set -euo pipefail
          uv export --project runtime --frozen --no-dev --no-emit-project --format requirements-txt |
            uvx --python 3.12 pip-audit==2.10.1 --disable-pip --require-hashes -r /dev/stdin \
              --format json --output "$RUNNER_TEMP/swarm-lock-audit.json"

      - name: Preserve audit findings even when the release gate fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: homepty-swarm-lock-audit
          path: ${{ runner.temp }}/swarm-lock-audit.json
          if-no-files-found: error

  secrets-and-containment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Reject derived or private artifacts tracked by Git
        run: python3 runtime/ci/check_containment.py

  source-sbom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Generate source SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: ./runtime
          format: cyclonedx-json
          artifact-name: homepty-swarm-backend-source.cdx.json
          output-file: homepty-swarm-backend-source.cdx.json

      - name: Scan source SBOM
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          sbom: homepty-swarm-backend-source.cdx.json
          fail-build: true
          severity-cutoff: high
